name: Validate Discord bot
on:
  push:
    branches: [fix/railway-free-db-resilience]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m py_compile bot.py
      - name: Run isolated registration tests
        run: python -m unittest discover -s tests -v
